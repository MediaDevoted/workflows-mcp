# Retired 2026-09-28. MD Agent owns task orchestration; Employee API owns identity.
services:
  workflows-mcp-pgvector:
    image: pgvector/pgvector:pg17
    container_name: workflows-mcp-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: embeddings
      POSTGRES_USER: workflows
      POSTGRES_PASSWORD: ${EMBEDDINGS_DB_PASSWORD:?set EMBEDDINGS_DB_PASSWORD}
    volumes:
    - workflows-mcp-embeddings:/var/lib/postgresql/data
    networks:
    - default
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U workflows -d embeddings
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  workflows-mcp-embeddings: null
networks:
  default: null
  shared-internal:
    name: ${SHARED_NETWORK:-shared-internal-prod}
    external: true
